<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ask My Codebase</title>
<style>
  :root { --bg:#070b18; --panel:rgba(18,26,49,.76); --border:rgba(147,176,255,.16); --text:#f2f5ff; --muted:#9ba8c8; --accent:#7470ff; --accent-2:#21d4c2; --accent-dim:#323062; --mono:'SF Mono','Fira Code',Consolas,monospace; }
  * { box-sizing:border-box; } ::selection { background:rgba(116,112,255,.45); }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; color:var(--text); font-family:Inter,ui-sans-serif,system-ui,sans-serif; background:radial-gradient(circle at 7% 0%,#16285a 0,transparent 30rem),radial-gradient(circle at 95% 18%,#123f51 0,transparent 28rem),var(--bg); }
  header { height:76px; padding:0 clamp(20px,5vw,72px); border-bottom:1px solid rgba(255,255,255,.07); display:flex; align-items:center; gap:13px; background:rgba(7,11,24,.55); backdrop-filter:blur(16px); }
  .brand-mark { width:37px; height:37px; display:grid; place-items:center; border-radius:12px; background:linear-gradient(135deg,var(--accent),#4a9bff); box-shadow:0 8px 26px rgba(92,103,255,.35); font-weight:800; font-size:18px; }
  header h1 { font-size:16px; margin:0; font-weight:750; letter-spacing:-.35px; } header h1 span { display:block; color:var(--muted); font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; margin-top:2px; }
  #userBar { margin-left:auto; display:flex; align-items:center; gap:12px; font-size:12px; color:#c5cdec; }.avatar { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:linear-gradient(135deg,#21d4c2,#4d7dff); color:#07101e; font-weight:800; } #userBar button { padding:8px 12px; background:transparent; border:1px solid var(--border); color:var(--muted); box-shadow:none; }
  #auth { margin:auto; width:min(490px,calc(100% - 36px)); background:linear-gradient(145deg,rgba(31,43,78,.84),rgba(15,22,42,.9)); border:1px solid var(--border); border-radius:24px; padding:38px; box-shadow:0 30px 100px rgba(0,0,0,.35); }.auth-kicker { color:var(--accent-2); font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; } #auth h2 { margin:10px 0; font-size:clamp(27px,5vw,36px); letter-spacing:-1.4px; line-height:1.05; } #auth p { color:var(--muted); font-size:14px; line-height:1.65; margin-bottom:24px; }
  #auth input,input[type=text],#question { width:100%; background:rgba(5,10,24,.58); border:1px solid var(--border); color:var(--text); padding:13px 15px; border-radius:12px; font-size:14px; outline:none; transition:.2s ease; } #auth input { margin:5px 0; } input:focus,select:focus { border-color:var(--accent); box-shadow:0 0 0 4px rgba(116,112,255,.14); }.hidden { display:none!important; }
  #authActions { display:flex; gap:10px; margin-top:15px; } #authActions button:last-child { background:transparent; border:1px solid var(--border); box-shadow:none; color:#dce2ff; } #authStatus { min-height:18px; margin-top:14px; color:#ffb6bd; font-size:12px; }
  #app { flex:1; width:min(1300px,100%); margin:0 auto; padding:34px clamp(18px,4vw,42px) 18px; min-height:0; display:flex; flex-direction:column; }.setup { padding:21px; background:var(--panel); border:1px solid var(--border); border-radius:19px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; box-shadow:0 14px 45px rgba(0,0,0,.12); } input[type=text] { font-family:var(--mono); font-size:13px; flex:1; min-width:260px; } select { background:rgba(5,10,24,.58); border:1px solid var(--border); color:var(--text); padding:13px 14px; border-radius:12px; font-size:13px; outline:none; }
  button { background:linear-gradient(135deg,var(--accent),#4e99ff); border:none; color:white; padding:13px 18px; border-radius:12px; font-size:13px; font-weight:750; cursor:pointer; transition:transform .2s ease,box-shadow .2s ease; box-shadow:0 10px 25px rgba(83,106,255,.24); } button:hover { transform:translateY(-1px); box-shadow:0 14px 30px rgba(83,106,255,.36); } button:disabled { background:var(--accent-dim); box-shadow:none; cursor:not-allowed; transform:none; } #status { font-size:12px; color:var(--muted); padding:13px 7px 5px; min-height:34px; }
  #chat { flex:1; overflow-y:auto; padding:24px 4px; display:flex; flex-direction:column; gap:20px; } #chat:empty::before { content:'Select a repository, then ask anything about its code.'; color:var(--muted); font-size:14px; margin:auto; padding:28px; border:1px dashed var(--border); border-radius:15px; }.msg { max-width:min(780px,88%); animation:enter .28s ease-out both; }.msg.user { align-self:flex-end; }.msg .bubble { padding:14px 17px; border-radius:16px; line-height:1.6; font-size:14px; white-space:pre-wrap; }.msg.user .bubble { background:linear-gradient(135deg,var(--accent),#4d91f2); color:white; border-bottom-right-radius:4px; box-shadow:0 10px 25px rgba(82,105,255,.2); }.msg.bot .bubble { background:var(--panel); border:1px solid var(--border); border-bottom-left-radius:4px; }.sources { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; }.source-chip { font-family:var(--mono); font-size:11px; color:var(--muted); background:rgba(31,42,76,.5); border:1px solid var(--border); padding:5px 9px; border-radius:7px; }
  .inputbar { padding:16px; display:flex; gap:8px; border:1px solid var(--border); background:rgba(13,19,38,.87); border-radius:18px; box-shadow:0 15px 45px rgba(0,0,0,.16); } #question { flex:1; border:none; background:transparent; box-shadow:none; } #question:focus { box-shadow:none; } footer { color:#7683a4; font-size:12px; text-align:center; padding:12px 24px 24px; } footer strong { color:#b8c4ea; font-weight:700; } @keyframes enter { from { opacity:0; transform:translateY(7px); } to { opacity:1; transform:translateY(0); } } @media(max-width:620px) { header { padding:0 18px; } #userEmail { display:none; } #app { padding:20px 14px 10px; } .setup { padding:14px; } select { width:100%; } .inputbar { padding:8px; } #auth { padding:29px 23px; } }
</style>
</head>
<body>

<header>
  <div class="brand-mark">⌘</div>
  <h1>Ask My Codebase<span>Private AI workspace</span></h1>
  <div id="userBar" class="hidden"><div class="avatar">N</div><span id="userEmail"></span><button onclick="signOut()">Sign out</button></div>
</header>

<main id="auth">
  <div class="auth-kicker">Built for builders</div>
  <h2>Your private<br>codebase copilot.</h2>
  <p>Sign in to keep your indexed repositories private to your account.</p>
  <input type="email" id="email" placeholder="Email address" autocomplete="email" />
  <input type="password" id="password" placeholder="Password (at least 6 characters)" autocomplete="current-password" />
  <div id="authActions"><button onclick="signIn()">Sign in</button><button onclick="signUp()">Create account</button></div>
  <div id="authStatus"></div>
</main>

<main id="app" class="hidden">
<div class="setup">
  <input type="text" id="repoUrl" placeholder="https://github.com/owner/repo.git" />
  <button id="ingestBtn" onclick="startIngest()">Index repo</button>
  <select id="repoSelect" onchange="onRepoSelect()">
    <option value="">Select indexed repo...</option>
  </select>
</div>
<div id="status" aria-live="polite"></div>

<div id="chat"></div>

<div class="inputbar">
  <input type="text" id="question" placeholder="e.g. what does GarFacade do?" onkeydown="if(event.key==='Enter') askQuestion()" />
  <button onclick="askQuestion()">Ask</button>
</div>
</main>
<footer>Designed with care · Created by <strong>Navneet Kumar</strong></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let currentRepoId = null;
let supabaseClient;

async function initialize() {
  const config = await fetch('/api/config').then(r => r.json());
  if (!config.supabaseUrl || !config.supabaseAnonKey) {
    document.getElementById('authStatus').textContent = 'Authentication is not configured. Ask the site owner to add Supabase environment variables.';
    return;
  }
  supabaseClient = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) showApp(session.user);
  supabaseClient.auth.onAuthStateChange((_event, session) => session ? showApp(session.user) : showAuth());
}

function showApp(user) {
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('userBar').classList.remove('hidden');
  document.getElementById('userEmail').textContent = user.email;
  refreshRepoList();
}

function showAuth() {
  currentRepoId = null;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('auth').classList.remove('hidden');
  document.getElementById('userBar').classList.add('hidden');
}

async function signIn() {
  const { error } = await supabaseClient.auth.signInWithPassword(credentials());
  document.getElementById('authStatus').textContent = error ? error.message : '';
}

async function signUp() {
  const { data, error } = await supabaseClient.auth.signUp(credentials());
  document.getElementById('authStatus').textContent = error ? error.message : data.session ? '' : 'Check your inbox to confirm your email, then sign in.';
}

function credentials() { return { email: document.getElementById('email').value.trim(), password: document.getElementById('password').value }; }
async function signOut() { await supabaseClient.auth.signOut(); }

async function api(url, options = {}) {
  const { data: { session } } = await supabaseClient.auth.getSession();
  const headers = { ...(options.headers || {}), Authorization: `Bearer ${session?.access_token || ''}` };
  const response = await fetch(url, { ...options, headers });
  const data = await response.json();
  if (response.status === 401) await supabaseClient.auth.signOut();
  return { response, data };
}

async function refreshRepoList() {
  const { data: repos } = await api('/api/repos');
  const select = document.getElementById('repoSelect');
  select.replaceChildren(new Option('Select indexed repo...', ''));
  repos.forEach(r => select.add(new Option(`${r.repoName} (${r.chunkCount} chunks)`, r.repoId)));
}

function onRepoSelect() {
  currentRepoId = document.getElementById('repoSelect').value;
}

async function startIngest() {
  const repoUrl = document.getElementById('repoUrl').value.trim();
  if (!repoUrl) return;
  const btn = document.getElementById('ingestBtn');
  btn.disabled = true;
  const statusEl = document.getElementById('status');

  const { data: ingest } = await api('/api/ingest', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ repoUrl })
  });
  const { jobId, error } = ingest;
  if (error) { statusEl.textContent = 'Error: ' + error; btn.disabled = false; return; }

  const poll = setInterval(async () => {
    const { data: s } = await api('/api/ingest/status?jobId=' + encodeURIComponent(jobId));
    statusEl.textContent = s.message || s.stage;
    if (s.stage === 'complete') {
      clearInterval(poll);
      btn.disabled = false;
      currentRepoId = s.repoId;
      await refreshRepoList();
      document.getElementById('repoSelect').value = s.repoId;
      statusEl.textContent = `Indexed ${s.repoName} — ${s.chunkCount} chunks. Ask away.`;
    } else if (s.stage === 'error') {
      clearInterval(poll);
      btn.disabled = false;
      statusEl.textContent = 'Error: ' + s.message;
    }
  }, 1200);
}

function addMessage(role, text, sources) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  div.appendChild(bubble);
  if (sources && sources.length) {
    const src = document.createElement('div');
    src.className = 'sources';
    sources.forEach(s => {
      const chip = document.createElement('span');
      chip.className = 'source-chip';
      chip.textContent = `${s.file}:${s.startLine}-${s.endLine}`;
      src.appendChild(chip);
    });
    div.appendChild(src);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function askQuestion() {
  const input = document.getElementById('question');
  const question = input.value.trim();
  if (!question) return;
  if (!currentRepoId) { alert('Index or select a repo first.'); return; }
  input.value = '';
  addMessage('user', question);

  const { data } = await api('/api/chat', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ repoId: currentRepoId, question })
  });
  if (data.error) { addMessage('bot', 'Error: ' + data.error); return; }
  addMessage('bot', data.answer, data.sources);
}

initialize();
</script>

</body>
</html>
